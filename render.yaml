services:
  - type: web
    name: t3code-cloud-demo
    runtime: docker
    plan: starter
    branch: feat/render-cloud-environment
    autoDeployTrigger: commit
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    healthCheckPath: /.well-known/t3/environment
    maxShutdownDelaySeconds: 300
    disk:
      name: t3code-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: T3CODE_PROJECT_REPO
        value: https://github.com/pingdotgg/t3code.git
      - key: T3CODE_PAIRING_TTL
        value: 24h
      - key: OPENAI_API_KEY
        sync: false
      - key: GH_TOKEN
        sync: false
